<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="buynow1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
    <link rel="stylesheet" href="buynow1.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
</head>

<body>

    <div class="container checkout-container">
      <h2 class="text-center mb-4">Checkout</h2>
        <form method="POST" action="process_payment.php">
          <!-- Billing Information -->
          <div class="row">
            <div class="col-md-6">
              <h4>Billing Information</h4>
              <div class="mb-3">
                <label for="buyerName" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="buyerName" name="buyerName" placeholder="Enter your full name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" required>
              </div>
            </div>
        
            <!-- Order Summary -->
            <div class="col-md-6">
              <h4>Order Summary</h4>
              <div class="checkout-summary">
                <img id="gameImage" src="img/rdr.jpg" alt="Game Thumbnail">
                <h5 id="gameTitle" class="mt-3">Selected Game: Red Dead Redemption 2</h5>
                <p id="gameDescription">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Visuals and graphics are extraordinary.</p>
                <h5 class="mt-3">Price: <span id="gamePrice">$59.99</span></h5>
                <!-- Hidden inputs to pass game details to the PHP script -->
                <input type="hidden" name="gameName" value="Red Dead Redemption 2">
                <input type="hidden" name="gamePrice" value="59.99">
              </div>
            </div>
          </div>
        
          <hr class="my-4">
        
          <!-- Payment Section -->
          <h4>Payment Method</h4>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="paymentMethod" class="form-label">Choose Payment Method</label>
              <select class="form-select" id="paymentMethod" name="paymentMethod" required>
                <option value="" selected disabled>Select payment method</option>
                <option value="bkash">bKash</option>
                <option value="nagad">Nagad</option>
                <option value="creditCard">Credit Card</option>
                <option value="paypal">PayPal</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="cardDetails" class="form-label">Card Details</label>
              <input type="text" class="form-control" id="cardDetails" name="cardDetails" placeholder="Enter your card number">
            </div>
          </div>
        
          <!-- Payment Icons -->
          <div class="payment-methods text-center mb-4">
            <img src="img/bkash.png" alt="bKash">
            <img src="img/nagad.png" alt="Nagad">
            <img src="img/visa.jpg" alt="Visa">
            <img src="img/paypal.png" alt="PayPal">
          </div>
        
          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 mt-3">Confirm Purchase</button>
        </form>
        
    </div>
    
      <footer>
        &copy; 2024 Zoro Game Store. All rights reserved.
      </footer>
    
      <!-- JavaScript -->
      <script>
        // Dynamically set game details from query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const gameName = urlParams.get('game');
        const gamePrice = urlParams.get('price');
        const gameImage = urlParams.get('image');
        const gameDescription = urlParams.get('description');
    
        if (gameName) {
          document.getElementById('gameTitle').innerText = `Selected Game: ${gameName}`;
        }
    
        if (gamePrice) {
          document.getElementById('gamePrice').innerText = `$${gamePrice}`;
        }
    
        if (gameImage) {
          document.getElementById('gameImage').src = gameImage;
        }
    
        if (gameDescription) {
          document.getElementById('gameDescription').innerText = gameDescription;
        }
    
        // Enable tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
      </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+FZx5nQ1z8A4I8ZH8zRBfWEeUpFm0" crossorigin="anonymous"></script>



  </body>

</html>
